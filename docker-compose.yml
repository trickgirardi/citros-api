services:
  postgres:
    image: postgres:17-alpine
    container_name: citros-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citros}
      POSTGRES_DB: ${POSTGRES_DB:-citros_api}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citros}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
